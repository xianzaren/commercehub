name: Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4@sha256:3466ba4a4828aa8d46fb7c3bc16b67b781c98413cf4ea0fac6feaa6e881faa26
        env:
          MYSQL_DATABASE: commercehub_test
          MYSQL_USER: commercehub
          MYSQL_PASSWORD: commercehub_ci_password
          MYSQL_ROOT_PASSWORD: commercehub_root_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pcommercehub_root_ci_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://commercehub:commercehub_ci_password@127.0.0.1:3306/commercehub_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://commercehub:commercehub_ci_password@127.0.0.1:3306/commercehub_test?charset=utf8mb4
      JWT_SECRET: commercehub-ci-secret-at-least-32-characters
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Ruff
        run: ruff check --config backend/pyproject.toml backend/app backend/tests scripts
      - name: Pytest with coverage
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=75

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
